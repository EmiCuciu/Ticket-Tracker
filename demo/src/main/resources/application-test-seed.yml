spring:
  datasource:
    url: jdbc:h2:mem:testdb-seed;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  h2:
    console:
      enabled: true

logging:
  level:
    root: WARN
    com.example.demo: DEBUG
    org.hibernate.SQL: WARN